<svg width="716" height="716" viewBox="0 0 716 716" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtro de sombra suave para la vibe de sticker -->
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="6" stdDeviation="3" flood-color="#0F0F1A" flood-opacity="0.18" />
    </filter>

    <style>
      .sticker-border { stroke: #FFFFFF; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; fill: #FFFFFF; }
      .stroke-main { stroke: #18181B; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-inner { stroke: #18181B; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ================= GRID 4x3 DE CHARMS TIPO STICKER CON DETALLES & CARITAS ================= -->

  <!-- 1. CLOVER (Con hojita extra y nervaduras) -->
  <g transform="translate(95, 110)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -5,-40 C -24,-40 -34,-18 -18,-5 C -36,-20 -48,2 -30,18 C -44,32 -22,46 -8,30 C -12,50 10,52 14,32 C 30,44 45,22 28,6 C 44,-5 30,-30 12,-18 C 18,-38 -2,-42 -5,-40 Z" />
    <path d="M -5,-40 C -24,-40 -34,-18 -18,-5 C -36,-20 -48,2 -30,18 C -44,32 -22,46 -8,30 C -12,50 10,52 14,32 C 30,44 45,22 28,6 C 44,-5 30,-30 12,-18 C 18,-38 -2,-42 -5,-40 Z" fill="#10B981" />
    <path class="stroke-main" d="M 0,0 C -15,-10 -25,-32 -2,-34 C 18,-32 10,-10 0,0 C -10,-12 -38,-5 -26,12 C -12,25 0,0 0,0 C -12,10 -2,38 10,25 C 20,10 0,0 0,0 C 12,-8 35,5 22,-12 C 10,-25 0,0 0,0 Z" />
    <!-- Nervaduras / Detalles doodle -->
    <path class="stroke-inner" d="M 0,-10 L 0,-26" />
    <path class="stroke-inner" d="M -10,0 L -24,2" />
    <path class="stroke-inner" d="M 0,10 L 4,24" />
    <path class="stroke-inner" d="M 10,0 L 22,-4" />
    <path class="stroke-inner" d="M 0,0 Q 6,24 -8,40" />
  </g>

  <!-- 2. CHERRY (¡Con ojos y boca doodle en cada cereza!) -->
  <g transform="translate(265, 110)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -18,22 C -40,22 -42,-8 -20,-10 C -10,-10 2,-28 18,-30 C 30,-31 22,-10 18,10 C 38,10 38,-15 18,-15 M 15,-8 C 40,-8 40,24 15,24 C -5,24 -2,2 15,-8 Z" />
    <circle cx="-16" cy="8" r="19" fill="#FF2A5F" />
    <circle cx="16" cy="12" r="18" fill="#FF2A5F" />
    <!-- Hojita en el tallo -->
    <path d="M 18,-30 C 28,-36 36,-26 26,-18 Z" fill="#10B981" class="stroke-main" />
    <!-- Tallos -->
    <path d="M -12,-8 C -5,-26 10,-28 18,-30 C 12,-8 14,0 14,8" fill="none" class="stroke-main" />
    <path class="stroke-main" d="M -16,8 m -19,0 a 19,19 0 1,0 38,0 a 19,19 0 1,0 -38,0" />
    <path class="stroke-main" d="M 16,12 m -18,0 a 18,18 0 1,0 36,0 a 18,18 0 1,0 -36,0" />
    <!-- Carita Cereza Izquierda (Sorprendida) -->
    <circle cx="-21" cy="4" r="2.5" fill="#18181B" />
    <circle cx="-11" cy="4" r="2.5" fill="#18181B" />
    <ellipse cx="-16" cy="11" rx="2.5" ry="3.5" fill="#18181B" />
    <!-- Carita Cereza Derecha (Sonriente/Pícara) -->
    <path class="stroke-inner" d="M 10,8 L 13,6 M 21,6 L 24,8" /> <!-- Ojos achinados/pestañas -->
    <path class="stroke-inner" d="M 12,14 Q 17,20 22,14" /> <!-- Sonrisa -->
  </g>

  <!-- 3. MOON (¡Con cara completa, pestañas y pecas!) -->
  <g transform="translate(435, 110)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M 15,-42 C 38,-28 38,12 18,32 C -8,52 -45,35 -42,5 C -40,-18 -18,-42 15,-42 Z" />
    <path d="M 12,-38 C 32,-25 32,10 15,28 C -5,45 -38,28 -35,5 C -22,12 -2,12 12,-5 C 22,-18 18,-30 12,-38 Z" fill="#FFE600" />
    <path class="stroke-main" d="M 12,-38 C 32,-25 32,10 15,28 C -5,45 -38,28 -35,5 C -22,12 -2,12 12,-5 C 22,-18 18,-30 12,-38 Z" />
    <!-- Ojo durmiendo con pestañas -->
    <path class="stroke-main" d="M -12,-4 Q -5,4 2,-4" fill="none" />
    <path class="stroke-inner" d="M -10,0 L -13,5 M -5,2 L -5,8 M 0,0 L 3,5" />
    <!-- Cachetito y Sonrisa -->
    <path class="stroke-main" d="M -15,12 Q -6,22 2,12" fill="none" />
    <path class="stroke-inner" d="M 2,10 L 5,14" /> <!-- Hoyuelito -->
    <!-- Estrellitas/Pecas en la luna -->
    <circle cx="-18" cy="-14" r="2" fill="#18181B" />
    <circle cx="-24" cy="-5" r="1.5" fill="#18181B" />
    <path class="stroke-inner" d="M 18,2 L 22,4" />
  </g>

  <!-- 4. SPARK (Con mini chispa y detalles) -->
  <g transform="translate(605, 110)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M 0,-45 C 3,-15 15,-3 45,0 C 15,3 3,15 0,45 C -3,15 -15,3 -45,0 C -15,-3 -3,-15 0,-45 Z" />
    <path d="M 0,-42 C 3,-12 12,-3 42,0 C 12,3 3,12 0,42 C -3,12 -12,3 -42,0 C -12,-3 -3,-12 0,-42 Z" fill="#00E5FF" />
    <path class="stroke-main" d="M 0,-42 C 3,-12 12,-3 42,0 C 12,3 3,12 0,42 C -3,12 -12,3 -42,0 C -12,-3 -3,-12 0,-42 Z" />
    <!-- Detalles internos doodle -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" class="stroke-main" />
    <path class="stroke-inner" d="M -22,-22 L -14,-14 M 22,22 L 14,14 M 22,-22 L 14,-14 M -22,22 L -14,14" />
  </g>

  <!-- 5. FLAME (¡Con ojos traviesos y boca de fuego!) -->
  <g transform="translate(95, 350)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M 0,-45 C 18,-25 38,-5 32,22 C 28,40 2,46 -15,42 C -32,38 -38,18 -32,0 C -28,-15 -15,-28 0,-45 Z" />
    <path d="M 0,-40 C 15,-22 34,-2 28,20 C 24,36 0,42 -12,38 C -28,34 -34,16 -28,0 C -22,-12 -12,-25 0,-40 Z" fill="#FF5722" />
    <path class="stroke-main" d="M 0,-40 C 15,-22 34,-2 28,20 C 24,36 0,42 -12,38 C -28,34 -34,16 -28,0 C -22,-12 -12,-25 0,-40 Z" />
    <!-- Llama interna amarilla -->
    <path d="M -6,34 C -16,30 -18,15 -8,2 C 2,14 10,22 4,34 Z" fill="#FFE600" class="stroke-inner" />
    <!-- Ojos Maliciosos / Traviesos -->
    <path class="stroke-main" d="M -16,-2 L -6,4 M 12,-2 L 2,4" /> <!-- Cejas enojadas/funky -->
    <circle cx="-10" cy="6" r="3" fill="#18181B" />
    <circle cx="6" cy="6" r="3" fill="#18181B" />
    <!-- Boca abierta sonriendo -->
    <path d="M -8,16 Q -2,24 4,16 Z" fill="#18181B" class="stroke-inner" />
  </g>

  <!-- 6. HEART (Con parche/curita doodle) -->
  <g transform="translate(265, 350)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M 0,38 C -28,20 -48,-5 -32,-32 C -18,-42 0,-20 0,-10 C 0,-20 18,-42 32,-32 C 48,-5 28,20 0,38 Z" />
    <path d="M 0,34 C -25,18 -42,-2 -28,-28 C -15,-38 0,-18 0,-8 C 0,-18 15,-38 28,-28 C 42,-2 25,18 0,34 Z" fill="#FF4081" />
    <path class="stroke-main" d="M 0,34 C -25,18 -42,-2 -28,-28 C -15,-38 0,-18 0,-8 C 0,-18 15,-38 28,-28 C 42,-2 25,18 0,34 Z" />
    <!-- Curita / Band-aid doodle cruzado -->
    <g transform="rotate(-20)">
      <rect x="-16" y="-6" width="32" height="12" rx="4" fill="#FFE0B2" class="stroke-inner" />
      <line x1="-4" y1="-5" x2="-4" y2="5" class="stroke-inner" />
      <line x1="4" y1="-5" x2="4" y2="5" class="stroke-inner" />
      <circle cx="0" cy="0" r="1" fill="#18181B" />
    </g>
  </g>

  <!-- 7. DICE (Dado funky con grietas y fuego) -->
  <g transform="translate(435, 350)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -28,-32 L 25,-35 L 35,22 L -22,32 Z" />
    <path d="M -25,-28 L 22,-30 L 30,20 L -18,28 Z" fill="#FFFFFF" />
    <path class="stroke-main" d="M -25,-28 L 22,-30 L 30,20 L -18,28 Z" />
    <!-- Puntos imperfectos -->
    <circle cx="-12" cy="-15" r="4.5" fill="#18181B" />
    <circle cx="12" cy="-18" r="4" fill="#18181B" />
    <circle cx="2" cy="-2" r="5.5" fill="#FF2A5F" />
    <circle cx="-8" cy="14" r="4" fill="#18181B" />
    <circle cx="16" cy="10" r="4.5" fill="#18181B" />
    <!-- Detalle de grieta/doodle -->
    <path class="stroke-inner" d="M 22,-30 L 18,-20 L 24,-14" />
  </g>

  <!-- 8. EYE (Ojo alien con pestañas y derramado) -->
  <g transform="translate(605, 350)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -42,-2 C -20,-28 20,-28 42,-2 C 20,28 -20,28 -42,-2 Z" />
    <path d="M -38,0 C -18,-22 18,-22 38,0 C 18,22 -18,22 -38,0 Z" fill="#A7F3D0" />
    <path class="stroke-main" d="M -38,0 C -18,-22 18,-22 38,0 C 18,22 -18,22 -38,0 Z" />
    <circle cx="0" cy="0" r="12" fill="#18181B" />
    <circle cx="-4" cy="-4" r="3.5" fill="#FFFFFF" />
    <circle cx="3" cy="3" r="1.5" fill="#FFFFFF" />
    <!-- Venitas / Pestañas extra -->
    <path class="stroke-main" d="M -20,-16 L -26,-26 M 0,-20 L 0,-30 M 20,-16 L 26,-26" />
    <path class="stroke-inner" d="M -30,0 Q -22,-2 -18,4" />
    <path class="stroke-inner" d="M 30,0 Q 22,2 18,-4" />
  </g>

  <!-- 9. MUSHROOM (¡Con ojos tristes/tiernos y boca chillón!) -->
  <g transform="translate(95, 580)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -35,5 C -38,-22 -15,-38 0,-38 C 18,-38 38,-22 35,5 C 20,8 18,38 0,38 C -18,38 -20,8 -35,5 Z" />
    <!-- Tallo con Carita -->
    <path d="M -12,2 C -12,32 12,32 12,2 Z" fill="#FFFFFF" />
    <path class="stroke-main" d="M -12,2 C -12,32 12,32 12,2 Z" />
    <!-- Ojos ttiernos y boca abierta del hongo -->
    <circle cx="-5" cy="14" r="2.5" fill="#18181B" />
    <circle cx="5" cy="14" r="2.5" fill="#18181B" />
    <path class="stroke-inner" d="M -2,22 Q 0,26 2,22 Z" fill="#18181B" />
    <!-- Sombrero Morado -->
    <path d="M -35,5 C -38,-20 -15,-35 0,-35 C 18,-35 38,-20 35,5 C 15,10 -15,10 -35,5 Z" fill="#A855F7" />
    <path class="stroke-main" d="M -35,5 C -38,-20 -15,-35 0,-35 C 18,-35 38,-20 35,5 C 15,10 -15,10 -35,5 Z" />
    <!-- Lunares Blancos con borde -->
    <circle cx="-16" cy="-12" r="5.5" fill="#FFFFFF" class="stroke-inner" />
    <circle cx="14" cy="-15" r="6.5" fill="#FFFFFF" class="stroke-inner" />
    <circle cx="0" cy="-4" r="4" fill="#FFFFFF" class="stroke-inner" />
    <circle cx="-25" cy="-2" r="3" fill="#FFFFFF" class="stroke-inner" />
  </g>

  <!-- 10. STARFISH / FLOWER WEIRD (Con espirales) -->
  <g transform="translate(265, 580)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M 0,-38 C 12,-18 32,-32 38,-10 C 22,2 38,22 18,32 C 8,18 -18,38 -28,20 C -18,5 -38,-5 -30,-22 C -18,-15 -10,-28 0,-38 Z" />
    <path d="M 0,-35 C 10,-16 28,-28 34,-8 C 18,2 34,20 15,28 C 6,15 -15,34 -24,18 C -15,4 -34,-4 -26,-18 C -15,-12 -8,-25 0,-35 Z" fill="#C084FC" />
    <path class="stroke-main" d="M 0,-35 C 10,-16 28,-28 34,-8 C 18,2 34,20 15,28 C 6,15 -15,34 -24,18 C -15,4 -34,-4 -26,-18 C -15,-12 -8,-25 0,-35 Z" />
    <!-- Centro Espiral -->
    <circle cx="0" cy="0" r="9" fill="#FFE600" class="stroke-main" />
    <path class="stroke-inner" d="M -3,-3 C 0,-6 4,-2 2,2 C 0,4 -3,1 -1,-1" fill="none" />
  </g>

  <!-- 11. LIGHTNING (Rayo con rayitas de poder) -->
  <g transform="translate(435, 580)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -12,-42 L 18,-42 L 2,-12 L 22,-12 L -18,42 L -6,2 L -22,2 Z" />
    <path d="M -8,-38 L 14,-38 L 0,-10 L 16,-10 L -14,36 L -4,4 L -18,4 Z" fill="#FFEB3B" />
    <path class="stroke-main" d="M -8,-38 L 14,-38 L 0,-10 L 16,-10 L -14,36 L -4,4 L -18,4 Z" />
    <!-- Trazo interno de energía -->
    <path class="stroke-inner" d="M -2,-30 L 8,-30 L 0,-16" />
    <path class="stroke-inner" d="M 22,5 L 28,10 M -20,-10 L -26,-14" />
  </g>

  <!-- 12. PLANET (Planeta con carita o cráteres funky) -->
  <g transform="translate(605, 580)" filter="url(#sticker-shadow)">
    <path class="sticker-border" d="M -22,-22 C -30,-8 -30,12 -18,22 C -6,30 15,28 25,18 C 38,20 48,8 40,-8 C 32,-22 10,-28 -2,-22 C -12,-28 -22,-25 -22,-22 Z" />
    <circle cx="0" cy="0" r="22" fill="#3B82F6" />
    <circle cx="0" cy="0" r="22" class="stroke-main" />
    <!-- Cráteres doodle -->
    <circle cx="-10" cy="-10" r="4" fill="#2563EB" class="stroke-inner" />
    <circle cx="8" cy="10" r="5" fill="#2563EB" class="stroke-inner" />
    <!-- Anillo -->
    <path d="M -38,8 C -20,22 20,22 38,-8 C 22,-20 -20,-20 -38,8 Z" fill="none" class="stroke-main" />
    <path d="M -32,5 C -15,16 15,16 32,-5" stroke="#FFE600" stroke-width="5" stroke-linecap="round" />
  </g>

</svg>
